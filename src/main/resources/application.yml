server:
  port: 8080

spring:
  application:
    name: smartship-edge-core
  datasource:
    # 船端单库：只存本船数据（表结构见 schema/ship-schema.sql），分船在岸端按 mmsi 完成
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:zncb_ship}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000

# Spring Boot Actuator & Prometheus 端点暴露
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true


# 边缘计算引擎配置
smartship:
  edge:
    # 基础与静态身份配置（若留空则自动通过 AIS !AIVDO 报文动态识别本船 MMSI）
    mmsi: ""
    ship-id: ""

    # [模块一] 物理与协议接入配置
    collect:
      persist:
        enabled: true
        min-write-interval-seconds: 1 # [模块三] CAS 写入节流最小间隔（秒）
        # 本地兜底：主表写入失败先转 zncb_failed_writes；MySQL 整体故障则转磁盘 spool，
        # 回放器按 replay-interval-ms 周期重放。磁盘有界（fallback-max-mb），超限删最老并计数。
        fallback-dir: "data/failed-writes"
        fallback-max-mb: 100
        replay-enabled: true
        replay-interval-ms: 30000
        replay-batch-size: 200
        pool:
          core-size: 2                # 核心持久化工作线程数
          max-size: 4                 # 最大持久化工作线程数
          queue-capacity: 500         # 有界持久化任务缓冲队列容量
          keep-alive-seconds: 60
          await-termination-seconds: 30 # 优雅停机等待超时（秒）
      nmea:
        serial:
          enabled: true
          port: "auto"               # "auto" 自动探测 USB/物理串口，或指定 "COM3", "/dev/ttyUSB0"
          baud-rate: 9600
          data-bits: 8
          stop-bits: 1
          parity: "none"
        tcp:
          enabled: false
          host: "127.0.0.1"
          port: 9001
        udp:
          enabled: false
          port: 9002

    # [模块四] MQTT 上报链路配置
    uploader:
      enabled: true
      poll:
        fixed-delay-ms: 15000        # 定时增量轮询周期（毫秒）
        initial-delay-ms: 5000
        batch-size: 100              # 单批次最大拉取记录数
      mqtt:
        enabled: true
        broker-url: "tcp://broker.emqx.io:1883" # 默认公共测试 Broker
        client-id: "smartship_edge_demo"
        qos: 1                       # QoS 1 保证至少到达一次
        auto-reconnect: true
        keep-alive-interval: 60
        connection-timeout: 10
